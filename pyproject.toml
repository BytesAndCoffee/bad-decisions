[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "bad-decisions"
version = "1.2.1"
description = "Reusable engine and service for fill-in-the-blank party card games"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
maintainers = [{ name = "BytesAndCoffee" }]
classifiers = ["License :: OSI Approved :: MIT License"]
dependencies = [
  "fastapi==0.116.1",
  "pydantic==2.11.7",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
dev = [
  "build==1.3.0",
  "httpx==0.28.1",
  "pytest==8.4.1",
]

[project.scripts]
bad-decisions = "bad_decisions.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bad_decisions"]
include = ["src/bad_decisions/data/**", "src/bad_decisions/web/**"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "deploy", "imports", "LICENSES", "*.md", "*.py", "pyproject.toml", "requirements*.lock"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
