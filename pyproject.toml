[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "cards-against-coffee-server"
version = "1.0.3"
description = "Multi-pack random card round engine, CLI, and REST API"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "fastapi==0.116.1",
  "pydantic==2.11.7",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
dev = [
  "build==1.3.0",
  "httpx==0.28.1",
  "pytest==8.4.1",
]

[project.scripts]
cah = "cah_engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cah_engine"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "deploy", "imports", "LICENSES", "*.md", "*.py", "pyproject.toml", "requirements*.lock"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
