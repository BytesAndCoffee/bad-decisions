[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "bad-decisions-client"
version = "2.1.2"
description = "Dependency-free terminal client called Regret for Bad Decisions services"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = { text = "MIT" }
authors = [{ name = "Bad Decisions contributors" }]
maintainers = [{ name = "BytesAndCoffee" }]
keywords = ["party-game", "cli", "terminal", "multiplayer", "openapi", "homebrew"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment :: Board Games",
]

[project.scripts]
regret = "bad_decisions_client.cli:main"

[project.optional-dependencies]
tui = ["textual==8.2.8"]

[project.urls]
Homepage = "https://github.com/BytesAndCoffee/bad-decisions"
Documentation = "https://github.com/BytesAndCoffee/bad-decisions/blob/main/docs/GETTING_STARTED.md"
Source = "https://github.com/BytesAndCoffee/bad-decisions"
Issues = "https://github.com/BytesAndCoffee/bad-decisions/issues"
Changelog = "https://github.com/BytesAndCoffee/bad-decisions/blob/main/client/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/bad_decisions_client"]

# Installers place this under <prefix>/share/man/man1, which man finds from PATH.
[tool.hatch.build.targets.wheel.shared-data]
"man/regret.1" = "share/man/man1/regret.1"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "man", "*.md", "pyproject.toml"]
