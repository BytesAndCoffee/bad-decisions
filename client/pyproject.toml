[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "bad-decisions-client"
version = "1.8.5"
description = "Cross-platform terminal client for Bad Decisions services"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = { text = "MIT" }
authors = [{ name = "Bad Decisions contributors" }]
maintainers = [{ name = "BytesAndCoffee" }]
classifiers = ["Development Status :: 5 - Production/Stable", "Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]

[project.scripts]
regret = "bad_decisions_client.cli:main"

[project.urls]
Homepage = "https://github.com/BytesAndCoffee/bad-decisions"
Documentation = "https://github.com/BytesAndCoffee/bad-decisions#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/bad_decisions_client"]

# Installers place this under <prefix>/share/man/man1, which man finds from PATH.
[tool.hatch.build.targets.wheel.shared-data]
"man/regret.1" = "share/man/man1/regret.1"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "man", "*.md", "pyproject.toml"]
