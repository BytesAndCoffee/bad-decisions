name: Release

# Publishes both packages to PyPI when a vX.Y.Z tag is pushed. See docs/RELEASING.md.
# Uses PyPI Trusted Publishing (OIDC): no API token is stored anywhere.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Tag must be reachable from main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::tag $GITHUB_REF_NAME is not on main"; exit 1; }
      - name: Tag must match every package version
        run: python scripts/check_release_tag.py "$GITHUB_REF_NAME"
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Server tests
        run: python -m pytest
      - name: Client tests
        run: PYTHONPATH=client/src python -m pytest client/tests
      - name: Deploy script syntax
        run: |
          bash -n deploy.sh
          bash -n deploy/rollback.sh

  build:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build and validate both packages
        run: |
          python -m pip install build==1.3.0 twine==7.0.0
          python -m build .
          python -m build client
          twine check dist/* client/dist/*
      # Install exactly the files that will be published into a clean venv and
      # check what only packaging can break: packs, web assets, lock, man pages.
      - name: Smoke-test the built wheels
        run: |
          python -m venv "$RUNNER_TEMP/installed"
          "$RUNNER_TEMP/installed/bin/pip" install -r requirements.lock dist/*.whl client/dist/*.whl
          python scripts/check_installed.py "$RUNNER_TEMP/installed"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-dist
          path: client/dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/bad-decisions/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-dist
          path: server-dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: client-dist
          path: client-dist
      # skip-existing lets a re-run finish after a partial publish. PyPI never
      # replaces an existing file, so nothing already published can change.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: server-dist/
          skip-existing: true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: client-dist/
          skip-existing: true
