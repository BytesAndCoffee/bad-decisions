# Host-specific proposed integration for the existing HTTPS bytes.coffee server.
# Add the limit_req_zone to nginx.conf's http context, and add the location to
# the existing `server_name bytes.coffee` TLS block.

# http context:
limit_req_zone $binary_remote_addr zone=cah_api:10m rate=5r/s;

# existing bytes.coffee HTTPS server context:
location /cah/ {
    limit_req zone=cah_api burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
}
